version: "3.9"

services:
  tensorflow-jupyter:
    image: tensorflow/tensorflow:2.20.0-gpu-jupyter
    container_name: tf-jupyter
    ports:
      - "8888:8888"   # Jupyter Notebook
    volumes:
      - /home/kenneth28/my_projects/PROJECTS/Notebook Files/DEEP LEARNING/Tensorflow:/tf/notebooks
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    restart: "no"