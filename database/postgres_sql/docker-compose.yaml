services:
  postgres:
    image: postgres:15
    container_name: pg_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - myproj_pgdata:/var/lib/postgresql/data
    networks:
      - db_net

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - myproj_pgadmin_data:/var/lib/pgadmin
    networks:
      - db_net

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.latest
    container_name: dbt
    restart: unless-stopped
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app
    networks:
      - db_net
    depends_on:
      - postgres
    environment:
      DBT_PROFILES_DIR: /usr/app/.dbt

volumes:
  myproj_pgdata:
  myproj_pgadmin_data:

networks:
  db_net: